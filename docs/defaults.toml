# Generated by scripts/config-reference.sh from baton config show.
# Slot counts reflect the generation host; see configuration.md for formulas.
# Omit cache.dir to use your own XDG cache directory.
match_order = ["encode", "render", "ml", "install", "build"]

[lanes]
  [lanes.build]
    slots = 3
    max_weight = 3
    memory_gate = true
    max_wait = "30m"
    matchers = ["(?i)(^|[/\\\\\\s])(xcodebuild|gradle|cargo build|go build)(\\s|$)"]
  [lanes.encode]
    slots = 2
    max_weight = 2
    memory_gate = true
    max_wait = "30m"
    matchers = ["(?i)(^|[/\\\\\\s])ffmpeg(\\.exe)?(\\s|$)"]
  [lanes.install]
    slots = 1
    max_weight = 1
    memory_gate = true
    max_wait = "30m"
    matchers = ["(?i)(^|[/\\\\\\s])((npm|pnpm|yarn|bun)(\\.exe)? (i|install|ci)|pip(3)?(\\.exe)? install|uv(\\.exe)? (pip|sync)|brew install|cargo install)(\\s|$)"]
  [lanes.ml]
    slots = 1
    max_weight = 1
    memory_gate = true
    max_wait = "30m"
    matchers = ["(?i)(^|[/\\\\\\s])[^\\s]*(whisper|mlx|ollama|llama)[^\\s]*(\\s|$)"]
  [lanes.render]
    slots = 2
    max_weight = 2
    memory_gate = true
    max_wait = "30m"
    matchers = ["(?i)(^|[/\\\\\\s])[^\\s]*(remotion|hyperframes|playwright|puppeteer|chrome|chromium)[^\\s]*(\\s|$)"]

[memory]
  margin = "512M"
  poll_interval = "250ms"
  recovery_window = "2s"

[shims]
  commands = ["ffmpeg", "ffprobe", "npm", "pnpm", "yarn", "bun", "pip", "pip3", "uv", "cargo", "go", "xcodebuild"]
  [shims.fast_paths]
    ffmpeg = ["(^|\\s)-(version|h|help)(\\s|$)", "(^|\\s)-f\\s+null(\\s|$)"]
    ffprobe = [".*"]

[reap]
  older_than = "2h"
  grace_period = "5s"
  matchers = ["(?i)(chrome|chromium|chrome-headless-shell|chrome-devtools-mcp|playwright|puppeteer|remotion|hyperframes|ffmpeg)"]

[gc]
  roots = []
  patterns = ["**/out/slice-*.mp4", "**/.remotion/**"]
  older_than = "168h"

[cache]
  # dir defaults to XDG_CACHE_HOME/baton (or ~/.cache/baton).
  max_size = "10G"
  env = []

[browser]
  executable = ""
  flags = []
  idle_timeout = "10m"
