name: Prepare release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the tagged source on available native runners before creating a draft.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Run full gate
        if: runner.os != 'Windows'
        run: make check
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o baton.exe ./cmd/baton
          exit $LASTEXITCODE

  draft:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Build archives and prepare GitHub draft
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach formula for manual tap review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > dist/baton.rb
          gh release upload "$GITHUB_REF_NAME" dist/baton.rb --repo "$GITHUB_REPOSITORY"
