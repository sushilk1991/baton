name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        # SPEC.md requires macos-13; see docs/architecture.md for availability.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
        go: ["1.22.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Run full gate
        if: runner.os != 'Windows'
        run: make check
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o baton.exe ./cmd/baton
          exit $LASTEXITCODE

  # make check skips lint when golangci-lint is missing, as on these runners,
  # so lint runs here once with the version the repo is checked against.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
